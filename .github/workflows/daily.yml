# Daily: run ingestion, verify, then publish.
# - Data changed: commit and push (Cloudflare Pages deploys on push).
# - Nothing changed: call the deploy hook so dates still roll over.
# 08:17 UTC = 3:17am CDT / 2:17am CST.
name: Daily ingest and rebuild

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Refetch every source page (ignore saved state)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run ingestion
        id: ingest
        continue-on-error: true
        run: node scripts/ingest/run.ts ${{ inputs.full && '--full' || '' }}

      - name: Verify (tests + build)
        run: npm test && npm run build

      - name: Commit and push data changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "815live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Ingest: update listings ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy hook (no data changes)
        if: steps.commit.outputs.changed == 'false'
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret CF_PAGES_DEPLOY_HOOK is not set."
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$HOOK"

      - name: Report ingestion failure
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::One or more ingestion adapters failed; see the 'Run ingestion' step. Listings were still published."
          exit 1
