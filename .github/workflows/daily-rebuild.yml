# Rebuilds the site daily so "upcoming" and "this weekend" roll over.
# 08:17 UTC = 3:17am CDT / 2:17am CST, after the previous Chicago day has ended.
name: Daily rebuild

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret CF_PAGES_DEPLOY_HOOK is not set."
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$HOOK"
